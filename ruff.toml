# ruff 設定 — 由 .claude/hooks/after-edit.ps1 自動執行
# （對改動的 .py 檔跑 ruff check --fix + ruff format）
line-length = 100
target-version = "py313"

[lint]
# 預設規則 + 常用實用規則；刻意保持寬鬆，避免淹沒既有程式碼。
# E=pycodestyle, F=pyflakes, W=warning, I=isort, UP=pyupgrade, B=bugbear
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # 行長交給 formatter 處理

[lint.per-file-ignores]
# 根目錄腳本通常先做 sys.path.insert / load_dotenv / sys.stdout.reconfigure
# 才能 import，E402 是設計使然，逐檔豁免（src/ 內維持嚴格）
"configure.py" = ["E402"]
"draft_one.py" = ["E402"]
"find_drafts.py" = ["E402"]
"oauth_login.py" = ["E402"]
"oauth_paste.py" = ["E402"]
"refresh_token.py" = ["E402"]
"review_drafts.py" = ["E402"]
"run_loop.py" = ["E402"]
"run_once.py" = ["E402"]
"verify.py" = ["E402"]

[format]
quote-style = "double"
